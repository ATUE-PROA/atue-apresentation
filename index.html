<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Tema claro é o padrão; o escuro segue o navegador até uma escolha explícita. -->
    <script>
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('atue-theme')
        } catch (error) {
          stored = null
        }
        var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', isDark)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', isDark ? '#0A0A0A' : '#FFFFFF')
      })()
    </script>
    <meta
      name="description"
      content="Painel de conformidade da ATUE: índice, pendências priorizadas e central de documentos."
    />
    <title>ATUE — Conformidade e privacidade</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
